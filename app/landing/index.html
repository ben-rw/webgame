<!DOCTYPE html>
<html>
  <body>
    <h1>Webgame!</h1>
    <h3>Join a Room</h3>
    <form action="/room/join" method="post" id="joinForm">
        <input type="text" id="name" name="username">
            <label for="name">Name</label><br>
        <input type="text" id="room code" name="roomID">
            <label for="room code">Room Code</label><br>
        <button type="submit">Join Room</button>
    </form>
    <br>
    <h3>Create a Room</h3>
    <form action="/room" method="post" id="createForm">
        <input type="text" id="name" name="username">
            <label for="name">Name</label><br>
        <button type="submit">Create Room</button>
    </form>
  </body>
</html>
